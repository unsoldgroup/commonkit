[workspace]
members = [
  "crates/commonkit-about-me",
  "crates/commonkit-contracts",
  "crates/commonkit-config",
  "crates/commonkit-core",
  "crates/commonkit-reconcile",
  "crates/commonkit-adapters",
  "crates/commonkit-platform",
  "crates/commonkit-cli",
  "crates/commonkit-service",
  "crates/commonkit-mcp",
  "crates/commonkit-relay",
  "crates/commonkit-snapshots",
  "crates/commonkit-skills",
  "crates/commonkit-execution",
  "crates/commonkit-execd",
  "crates/commonkit-personal-context",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/unsoldgroup/commonkit"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
schemars = "1.2"
sha2 = "0.10"
regex = "1"
thiserror = "2"
cap-std = "3.4"
directories = "6"
clap = { version = "4.5", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
rand = "0.9"
subtle = "2.6"
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
rmcp = { version = "=2.2.0", features = ["transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
anyhow = "1"
url = "2.5"
rusqlite = { version = "0.32", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
chacha20poly1305 = "0.10"
age = { version = "=0.12.1", default-features = false }
base64 = "0.22"
zeroize = "1.8"
