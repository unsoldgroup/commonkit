[workspace]
members = [
  "crates/commonkit-contracts",
  "crates/commonkit-config",
  "crates/commonkit-core",
  "crates/commonkit-reconcile",
  "crates/commonkit-adapters",
  "crates/commonkit-platform",
  "crates/commonkit-cli",
  "crates/commonkit-service",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/unsoldgroup/commonkit"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
schemars = "1.2"
sha2 = "0.10"
regex = "1"
thiserror = "2"
cap-std = "3.4"
directories = "6"
clap = { version = "4.5", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
rand = "0.9"
subtle = "2.6"
tower = { version = "0.5", features = ["util"] }
