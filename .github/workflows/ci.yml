name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  node:
    name: Node and desktop web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --dir apps/desktop typecheck
      - run: pnpm --dir apps/desktop test
      - run: pnpm --dir apps/desktop build

  rust:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features --locked
      - if: runner.os == 'Windows'
        run: cargo test --locked -p commonkit-adapters --test credentials native_windows_credential_manager_round_trip_is_target_scoped -- --exact
      - if: runner.os == 'Windows'
        run: cargo test --locked -p commonkit-platform --test paths native_windows_private_path_acl_is_enforced_and_verified -- --exact

  rust-quality:
    name: Rust quality and generated contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo run --locked -p commonkit-contracts --bin generate-schemas -- schemas
      - run: git diff --exit-code -- schemas

  unsigned-installed-lifecycle:
    name: Unsigned installed lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Install unsigned CLI and daemon into an isolated prefix
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/commonkit-install"
          cargo install --locked --path crates/commonkit-cli --root "$install_root"
          cargo install --locked --path crates/commonkit-service --root "$install_root"
          cargo install --locked --path crates/commonkit-adapters --bin commonkit-target-helper --root "$install_root"
          cargo install --locked --path crates/commonkit-snapshots --bin commonkit-snapshot-recovery-fixture --root "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
      - name: Execute complete installed-artifact lifecycle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/installed-lifecycle.sh
          scripts/installed-lifecycle.sh "$RUNNER_TEMP/commonkit-lifecycle" "$RUNNER_TEMP/commonkit-install/bin"
      - name: Exercise installed helper through isolated OpenSSH
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          chmod +x scripts/installed-helper-ssh-smoke.sh
          scripts/installed-helper-ssh-smoke.sh "$RUNNER_TEMP/commonkit-ssh-smoke" "$RUNNER_TEMP/commonkit-install/bin"
      - name: Execute legacy-to-Rust relay compatibility suite
        shell: bash
        env:
          COMMONKITD_BIN: commonkitd
        run: pnpm --filter mcp-local-relay test:compatibility

  tauri-rust:
    name: Tauri Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  providers-unix:
    name: Pinned providers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      APM_VERSION: 0.25.0
      CHEZMOI_VERSION: 2.70.4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download checksum-pinned providers
        shell: bash
        run: |
          set -euo pipefail
          provider_dir="$RUNNER_TEMP/commonkit-providers"
          mkdir -p "$provider_dir/apm"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ "$(uname -m)" == "arm64" ]]; then
              apm_asset="apm-darwin-arm64.tar.gz"
              apm_sha="8b46963bf881d1369c1ee30f6099fba54d13379a8860ec190cdcaf50cf4586a9"
              chezmoi_asset="chezmoi-darwin-arm64"
              chezmoi_sha="f32d5f9b5802a5afc5f60d4ca6839e6ed65b658c9ded9053434526194d5fad5d"
            else
              apm_asset="apm-darwin-x86_64.tar.gz"
              apm_sha="8b1c43543113550e49939c7970429e19881d6347c90c44185eb55ea73d0eca73"
              chezmoi_asset="chezmoi-darwin-amd64"
              chezmoi_sha="aad5f6005ca42d8ca63fb05cf173489d0bbf4ebb6bf991cb2e30972b6323aa71"
            fi
          else
            apm_asset="apm-linux-x86_64.tar.gz"
            apm_sha="7a4281ef915e9609f8841eced19285bf2dcf702862302171f7e893c30e1b3244"
            chezmoi_asset="chezmoi-linux-amd64"
            chezmoi_sha="f9e5c2822356f4e96f94442efc5cb5ef35df2a06f7f06b6315dbdac0dbaf22a3"
          fi
          curl --fail --location --retry 3 "https://github.com/microsoft/apm/releases/download/v${APM_VERSION}/${apm_asset}" --output "$provider_dir/apm.tar.gz"
          printf '%s  %s\n' "$apm_sha" "$provider_dir/apm.tar.gz" | shasum -a 256 --check
          tar -xzf "$provider_dir/apm.tar.gz" -C "$provider_dir/apm"
          apm_bin="$(find "$provider_dir/apm" -type f -name apm -perm -u+x | head -1)"
          test -n "$apm_bin"
          curl --fail --location --retry 3 "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/${chezmoi_asset}" --output "$provider_dir/chezmoi"
          printf '%s  %s\n' "$chezmoi_sha" "$provider_dir/chezmoi" | shasum -a 256 --check
          chmod +x "$provider_dir/chezmoi"
          echo "COMMONKIT_APM_025_BIN=$apm_bin" >> "$GITHUB_ENV"
          echo "COMMONKIT_CHEZMOI_2_70_4=$provider_dir/chezmoi" >> "$GITHUB_ENV"
      - run: cargo test --locked -p commonkit-adapters --test apm_real_provider checksum_pinned_apm_release_materializes_without_touching_live_target -- --ignored --exact
      - run: cargo test --locked -p commonkit-adapters --test chezmoi_provider real_chezmoi_release_materializes_supported_fixtures_deterministically -- --ignored --exact
      - name: Remove downloaded providers
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/commonkit-providers"

  providers-windows:
    name: Pinned providers (windows-latest)
    runs-on: windows-latest
    env:
      APM_VERSION: 0.25.0
      CHEZMOI_VERSION: 2.70.4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download checksum-pinned providers
        shell: pwsh
        run: |
          $providerDir = Join-Path $env:RUNNER_TEMP "commonkit-providers"
          New-Item -ItemType Directory -Force -Path $providerDir | Out-Null
          $apmArchive = Join-Path $providerDir "apm.zip"
          Invoke-WebRequest "https://github.com/microsoft/apm/releases/download/v$env:APM_VERSION/apm-windows-x86_64.zip" -OutFile $apmArchive
          if ((Get-FileHash $apmArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "1d9b3b44ffe031c331f4dfe33694bbb80d10d16165ca053110b96dbeb7365943") { throw "APM checksum mismatch" }
          $apmDir = Join-Path $providerDir "apm"
          Expand-Archive $apmArchive -DestinationPath $apmDir
          $apmBin = (Get-ChildItem $apmDir -Recurse -Filter apm.exe | Select-Object -First 1).FullName
          if (-not $apmBin) { throw "APM executable missing from verified archive" }
          $chezmoiBin = Join-Path $providerDir "chezmoi.exe"
          Invoke-WebRequest "https://github.com/twpayne/chezmoi/releases/download/v$env:CHEZMOI_VERSION/chezmoi-windows-amd64.exe" -OutFile $chezmoiBin
          if ((Get-FileHash $chezmoiBin -Algorithm SHA256).Hash.ToLowerInvariant() -ne "531e4b3d1f0814c4e962cd1a380bd4ea85f97aee5cc81ee27eea551339380ff7") { throw "chezmoi checksum mismatch" }
          "COMMONKIT_APM_025_BIN=$apmBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "COMMONKIT_CHEZMOI_2_70_4=$chezmoiBin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cargo test --locked -p commonkit-adapters --test apm_real_provider checksum_pinned_apm_release_materializes_without_touching_live_target -- --ignored --exact
      - name: Verify pinned chezmoi executable
        shell: pwsh
        run: |
          $version = & $env:COMMONKIT_CHEZMOI_2_70_4 --version
          if ($version -notmatch "2\.70\.4") { throw "unexpected chezmoi version: $version" }
      - name: Remove downloaded providers
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP "commonkit-providers") -ErrorAction SilentlyContinue
