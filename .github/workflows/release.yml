name: Signed release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate dispatch is running from the requested tag ref
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: test "${{ github.ref }}" = "refs/tags/${{ inputs.tag }}"
      - run: node --test test/release-readiness.test.mjs

  package:
    needs: validate-contract
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            cli_target: universal-apple-darwin
            bundles: app,dmg
            artifact: commonkit-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: commonkit-windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_target: x86_64-unknown-linux-gnu
            bundles: AppImage,deb
            artifact: commonkit-linux
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      COMMONKIT_UPDATE_ENDPOINT: ${{ vars.COMMONKIT_UPDATE_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - name: Fail closed when release credentials are absent
        shell: bash
        run: |
          set -eu
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$COMMONKIT_UPDATE_ENDPOINT"
          if [ "${{ runner.os }}" = macOS ]; then
            test -n "$APPLE_CERTIFICATE"
            test -n "$APPLE_CERTIFICATE_PASSWORD"
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_ID"
            test -n "$APPLE_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          fi
          if [ "${{ runner.os }}" = Windows ]; then
            test -n "$WINDOWS_CERTIFICATE"
            test -n "$WINDOWS_CERTIFICATE_PASSWORD"
            test -n "$WINDOWS_TIMESTAMP_URL"
          fi
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'commonkit-release.pfx'
          $certificateBytes = [Convert]::FromBase64String(($env:WINDOWS_CERTIFICATE -replace '\s', ''))
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw 'Windows signing certificate import did not return a thumbprint' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          Remove-Item -Force $certificatePath
      - run: node scripts/prepare-release-config.mjs "${{ inputs.tag || github.ref_name }}"
      - name: Build signed and notarized desktop bundles
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Build standalone CLI
        shell: bash
        run: scripts/build-release-cli.sh "${{ matrix.cli_target }}" release-artifacts
      - name: Sign and verify standalone macOS CLI
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" release-artifacts/commonkit-macos-universal
          codesign --verify --strict --verbose=2 release-artifacts/commonkit-macos-universal
      - name: Sign and verify standalone Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signtoolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($signtoolCommand) {
            $signtool = $signtoolCommand.Source
          } else {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows release runner' }
          & $signtool sign /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT /fd SHA256 /tr $env:WINDOWS_TIMESTAMP_URL /td SHA256 release-artifacts/commonkit-windows-x86_64.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed to sign standalone CommonKit CLI' }
          & $signtool verify /pa /all /v release-artifacts/commonkit-windows-x86_64.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed to verify standalone CommonKit CLI' }
      - name: Collect desktop and updater payloads
        shell: bash
        run: scripts/collect-release-assets.sh "${{ runner.os }}" release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-artifacts
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    env:
      COMMONKIT_RELEASE_DOWNLOAD_BASE: ${{ vars.COMMONKIT_RELEASE_DOWNLOAD_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: commonkit-*
          path: release-artifacts
          merge-multiple: true
      - name: Assemble latest.json updater metadata
        run: node scripts/assemble-updater-manifest.mjs release-artifacts "${{ inputs.tag || github.ref_name }}"
      - name: Generate syft SPDX SBOM from final payload set
        uses: anchore/sbom-action@v0
        with:
          path: release-artifacts
          format: spdx-json
          output-file: release-artifacts/commonkit.spdx.json
      - name: Produce SHA256SUMS
        run: scripts/checksum-release-assets.sh release-artifacts
      - uses: sigstore/cosign-installer@v3
      - name: cosign sign-blob checksum manifest with GitHub OIDC identity
        run: cosign sign-blob --yes --bundle release-artifacts/SHA256SUMS.sig release-artifacts/SHA256SUMS
      - run: node scripts/verify-release-assets.mjs release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
