name: Release readiness (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/release-readiness.test.mjs

  # Deliberately disabled until real signing identities and lifecycle fixtures are
  # provisioned. Removing this guard is a release decision, not routine CI work.
  package:
    if: ${{ false }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: AppImage,deb
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      COMMONKIT_UPDATE_ENDPOINT: ${{ vars.COMMONKIT_UPDATE_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fail closed when release credentials are absent
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ "${{ runner.os }}" = macOS ]; then
            test -n "$APPLE_CERTIFICATE"
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_ID"
            test -n "$APPLE_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          fi
          if [ "${{ runner.os }}" = Windows ]; then
            test -n "$WINDOWS_CERTIFICATE"
            test -n "$WINDOWS_CERTIFICATE_PASSWORD"
          fi
      - run: node scripts/prepare-release-config.mjs
      - name: Build signed desktop bundle and standalone CLI
        run: 'echo "Disabled contract: cargo build ${{ matrix.target }}; Tauri ${{ matrix.bundles }}"'
      - name: Produce SBOM, checksums, signatures, and updater metadata
        run: 'echo "Disabled contract: syft; SHA256SUMS; cosign sign-blob; latest.json"'
      - run: node scripts/verify-release-assets.mjs release-artifacts
