[package]
name = "commonkit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "commonkit"
path = "src/main.rs"

[dependencies]
clap.workspace = true
commonkit-config = { path = "../commonkit-config" }
commonkit-adapters = { path = "../commonkit-adapters" }
commonkit-contracts = { path = "../commonkit-contracts" }
commonkit-platform = { path = "../commonkit-platform" }
commonkit-reconcile = { path = "../commonkit-reconcile" }
commonkit-service = { path = "../commonkit-service" }
commonkit-skills = { path = "../commonkit-skills" }
serde_json.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = "3"
