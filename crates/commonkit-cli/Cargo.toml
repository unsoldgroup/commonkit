[package]
name = "commonkit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "commonkit"
path = "src/main.rs"

[dependencies]
clap.workspace = true
commonkit-config = { path = "../commonkit-config" }
commonkit-adapters = { path = "../commonkit-adapters" }
commonkit-contracts = { path = "../commonkit-contracts" }
commonkit-core = { path = "../commonkit-core" }
commonkit-platform = { path = "../commonkit-platform" }
commonkit-personal-context = { path = "../commonkit-personal-context" }
commonkit-reconcile = { path = "../commonkit-reconcile" }
commonkit-service = { path = "../commonkit-service" }
commonkit-skills = { path = "../commonkit-skills" }
serde_json.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
age.workspace = true
tempfile = "3"
