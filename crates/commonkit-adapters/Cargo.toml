[package]
name = "commonkit-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cap-std.workspace = true
commonkit-contracts = { path = "../commonkit-contracts" }
commonkit-core = { path = "../commonkit-core" }
commonkit-platform = { path = "../commonkit-platform" }
commonkit-reconcile = { path = "../commonkit-reconcile" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
serde_yaml = "0.9.34"
sha2.workspace = true
thiserror.workspace = true
tempfile = "3"
url.workspace = true
reqwest.workspace = true
tokio.workspace = true
futures-util.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
jsonschema = { version = "0.49.9", default-features = false }
